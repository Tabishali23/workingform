<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation using html css and js onlyyyyy -----</title>
    <link rel="stylesheet" href="style.css">
       <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
       <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>
  <div class="container">
  <form action="https://formsubmit.co/anomynoususer234@gmail.com" method="POST" onsubmit="return validdateForm(event);">
      <i class="fas fa-paper-plane"></i>
<!-- full name -->
      <div class="input-group">
        <label>Full Name</label>
        <input type="text" name="Name" placeholder="Enter your name" id="contact-name" onkeyup="validdateName();">
        <span id="name-error"></span>
      </div>
<!-- phone num -->
      <div class="input-group">
        <label>Phone No.</label>
        <input type="tel" name="Phone" placeholder="12345678901" id="phone-number" onkeyup="validdatePhone();">
        <span id="phone-error"></span>
      </div>
<!-- email id -->
      <div class="input-group">
        <label>Email Id</label>
        <input type="email" name="Email" placeholder="Enter Email" id="email-id" onkeyup="validdateemail();">
          <span id="email-error"></span>
      </div>   
      <!-- msg -->

      <div class="input-group">
        <label>Your Message</label>
       <textarea rows="5" name="Message" placeholder="Enter your message" id="msg-id" onkeyup="validdateMsg();"></textarea>
          <span id="text-error"></span>
      </div>
<!-- submit -->
    <button onclick="return validdateForm(event);">Submit</button>
     <span id="submit-error"></span>
   
  </form>
  </div>
  <!--  Success Modal -->
<div id="form-success-modal" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-icon-circle">
            <i class="fa-solid fa-check"></i>
        </div>
        <h2>Submission Received!</h2>
        <p>Thank you. Your message has been processed successfully. We will get back to you shortly.</p>
        <div class="modal-progress-bar">
            <div class="progress-fill"></div>
        </div>
    </div>
</div>

   <script src="https://kit.fontawesome.com/c4254e24a8.js" crossorigin="anonymous"></script>
  <script src="app.js"></script>
  
</body>
</html>
